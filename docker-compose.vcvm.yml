name: cloakbrowser-manager-vcvm

services:
  manager:
    container_name: cloakbrowser-manager-vcvm
    image: cloakbrowser-manager:vcvm
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "127.0.0.1:${MANAGER_PORT:-18115}:8080"
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN is required for VCVM deployments}
      ACCESS_CONTROL_ENABLED: "1"
      PROXYCHECKER_URL: ${PROXYCHECKER_URL:-}
      PROXYCHECKER_ALLOWED_HOSTS: ${PROXYCHECKER_ALLOWED_HOSTS:-host.docker.internal}
      EXTENSION_CATALOG_DIR: ${EXTENSION_CATALOG_DIR:-/data/extension-catalog}
      # Host Orca bridge (read-only mounts below). Agent CLIs run on the host via
      # orca terminal.create; CBM_BASE_URL is the host-loopback Manager publish.
      HOME: /home/coder
      CBM_ORCA_BIN: ${CBM_ORCA_BIN:-/home/coder/.local/bin/orca-ide}
      CBM_ORCA_WORKTREE: ${CBM_ORCA_WORKTREE:-path:/home/coder/vk-repos/CloakBrowser-Manager-browser-use}
      CBM_ORCA_AGENT_WRAPPER: ${CBM_ORCA_AGENT_WRAPPER:-/home/coder/vk-repos/CloakBrowser-Manager-browser-use/scripts/orca_agent_cli.sh}
      CBM_BASE_URL: ${CBM_BASE_URL:-http://127.0.0.1:18115}
      CBM_AGENT_KEY_FILE: ${CBM_AGENT_KEY_FILE:-/home/coder/.config/cloakbrowser/orca-agent-key}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cloakbrowser-manager-vcvm-data:/data
      # Host Orca 1.4.x runtime + CLI (verified path for container→host reachability).
      - /home/coder/orca:/home/coder/orca:ro
      - /home/coder/.local:/home/coder/.local:ro
      - /home/coder/.config/orca:/home/coder/.config/orca:ro
    shm_size: "${VCVM_SHM_SIZE:-2gb}"
    cpus: "${VCVM_CPUS:-16.0}"
    mem_limit: "${VCVM_MEMORY_LIMIT:-32g}"
    pids_limit: 4096
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  cloakbrowser-manager-vcvm-data:
    name: cloakbrowser-manager-vcvm-data
